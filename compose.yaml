services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: gajiku_app
    ports:
      - "8080:80"
    environment:
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-penggajian_db}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-root}
    depends_on:
      - db
    volumes:
      - ./:/var/www/html

  db:
    image: mariadb:11
    container_name: gajiku_db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MARIADB_DATABASE: ${DB_DATABASE:-penggajian_db}
      MARIADB_USER: ${DB_USERNAME:-root}
      MARIADB_PASSWORD: ${DB_PASSWORD:-root}
    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  mariadb_data:
